<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V18 外观与访客验收</title>
<style>body{font:14px/1.6 system-ui;color:#263d30;background:#f3f5ee;margin:0;padding:16px}main{display:grid;grid-template-columns:minmax(240px,1fr) auto;gap:16px}section{background:white;border:1px solid #d6dfd3;border-radius:16px;padding:16px}button{font:inherit;padding:10px;margin:4px;border-radius:8px;border:1px solid #a9bda9;background:#f5f8f1}iframe{width:390px;height:844px;border:0;background:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#idle{color:#357052}</style>
<main><section><h1>V18 实际页面验收</h1><p>仅在隔离的本机测试浏览器中使用。此流程更改该隔离浏览器的应用设置，不接触生产账号。</p><button id="first">首次使用与访客路径</button><button id="matrix">四语与尺寸检查</button><button id="account">账号切换与社区限制</button><button id="audio">音频回归抽查</button><button id="account-preview">查看账号页面</button><button id="splash">重看开机造型</button><p id="idle">验收空闲</p><pre id="result"></pre></section><section style="padding:0;overflow:auto;max-width:calc(100vw - 32px)"><iframe id="app" src="/__qa/blank" allow="autoplay;microphone;camera" title="真实应用"></iframe></section></main>
<script>
(()=>{'use strict';const frame=document.querySelector('#app'),out=document.querySelector('#result'),idle=document.querySelector('#idle');let busy=false;const delay=ms=>new Promise(r=>setTimeout(r,ms)),w=()=>frame.contentWindow,d=()=>w().document,check=(v,s)=>{if(!v)throw Error(s);};async function until(fn,label,timeout=15000){const start=performance.now();while(performance.now()-start<timeout){if(fn())return;await delay(30);}throw Error('等待超时 '+label);}function click(selector){const el=d().querySelector(selector);check(el&&!el.disabled,'按钮不可用 '+selector);el.click();return el;}async function save(id,value){const item={id,at:new Date().toISOString(),...value};out.textContent=JSON.stringify(item,null,2);await fetch('/__qa/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item)});return item;}async function run(id,fn){if(busy)return;busy=true;idle.hidden=true;try{await save(id,{pass:true,...await fn()});}catch(error){await save(id,{pass:false,error:String(error.stack||error)});}finally{busy=false;idle.hidden=false;}}
function settings(lang='en',fresh=false){const current=JSON.parse(localStorage.getItem('sv12-prefs')||'{}');localStorage.setItem('sv12-prefs',JSON.stringify({...current,lang,region:{en:'us',zh:'cn',ja:'jp',de:'de'}[lang],localeChoiceVersion:fresh?0:1,tutorialAuto:fresh,learningPathIntroducedVersion:fresh?0:1,appMode:'full'}));}
async function load(route='home',width=390){frame.style.width=width+'px';const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.src='/?qaHarness=17&v=18&t='+Date.now()+'#'+route;await loaded;await until(()=>w().SVAccount&&w().SVViolinArt&&d().querySelector('#startup-layer'),'startup ready');}
async function dismissStartup(){const btn=d().querySelector('[data-action="skip-startup"]');if(btn)btn.click();await until(()=>!d().querySelector('#startup-layer'),'splash closes');}
async function route(page){w().location.hash=page;await until(()=>w().location.hash==='#'+page,'route '+page);await delay(220);}
function layout(){const doc=d(),actual=doc.documentElement;check(actual.scrollWidth<=actual.clientWidth+1,'overflow '+actual.scrollWidth+'/'+actual.clientWidth);check(!(w().__qaErrors||[]).length,'page errors '+(w().__qaErrors||[]).join(';'));return {width:actual.clientWidth,scrollWidth:actual.scrollWidth};}
document.querySelector('#first').onclick=()=>run('v18-first-guest',async()=>{localStorage.removeItem('sv-account-choice-v1');localStorage.removeItem('smartvio-learning-path-v1');settings('en',true);await load();check(!!d().querySelector('#startup-layer [data-sv-violin]'),'shared startup model');const skip=d().querySelector('.skip-startup').getBoundingClientRect();check(skip.width<145&&skip.height<=36,'compact skip');await dismissStartup();await until(()=>d().querySelector('#welcome-layer'),'country follows splash');click('[data-country="us"]');click('[data-action="commit-country"]');await until(()=>d().querySelector('.sv-account-dialog[open]'),'optional account opens');check(d().querySelectorAll('[data-account-provider][disabled]').length===4,'four honest reserved providers');click('[data-account-action="guest"]');await until(()=>d().querySelector('[data-lp-step]'),'learning after guest');check(d().querySelectorAll('[data-lp-step]').length===6,'six steps');check(!!d().querySelector('.lp-scene [data-sv-violin]'),'shared learning model');click('[data-lp-action="motion"]');check(d().querySelector('[data-lp-scene]').dataset.motion==='paused','pause');click('[data-lp-action="replay"]');check(d().querySelector('[data-lp-scene]').dataset.motion==='playing','replay');click('[data-lp-action="understood"]');const saved=JSON.parse(localStorage.getItem('smartvio-learning-path-v1'));check(saved.understoodStepIds.includes('instrument'),'progress saved');await route('practice');check(!!d().querySelector('[data-action="play"]'),'guest practice');await load('learn');await dismissStartup();await delay(150);check(!d().querySelector('.sv-account-dialog[open]'),'no repeat login nag');check(JSON.parse(localStorage.getItem('smartvio-learning-path-v1')).understoodStepIds.includes('instrument'),'progress retained');return {skip:{width:skip.width,height:skip.height},guestChoice:localStorage.getItem('sv-account-choice-v1'),...layout()};});
document.querySelector('#matrix').onclick=()=>run('v18-localization-layout',async()=>{const results=[];localStorage.setItem('sv-account-choice-v1','guest');for(const lang of ['zh','en','ja','de'])for(const width of [320,390,768]){settings(lang);await load('learn',width);await dismissStartup();await delay(100);check(d().querySelectorAll('[data-lp-step]').length===6,'learning6');check(!!d().querySelector('.lp-scene [data-sv-violin]'),'learning shared art');const learn=layout();await route('profile');check(!!d().querySelector('#account-host .sv-account-card'),'settings account');click('[data-account-action="open"]');await until(()=>d().querySelector('.sv-account-dialog[open]'),'account dialog');const box=d().querySelector('.sv-account-dialog').getBoundingClientRect();check(box.left>=0&&box.right<=width+1,'account dialog fits');check(d().querySelectorAll('[data-account-provider][disabled]').length===4,'providers disabled');check(d().querySelector('.sv-account-dialog').lang===lang,'account language');click('.sv-account-dialog [data-account-action="close"]');await delay(50);results.push({lang,width,...learn});}return {cases:results};});
document.querySelector('#account').onclick=()=>run('v18-account-community',async()=>{settings('en');localStorage.setItem('sv-account-choice-v1','guest');await load('community');await dismissStartup();await until(()=>d().querySelector('[data-sv-community]'),'community');const publicState=await (await w().fetch('/api/community/public')).json();check(publicState.viewer===null&&publicState.mine.length===0,'public no private data');click('[data-svc-action="new"]');await delay(80);const submit=d().querySelector('[data-svc-action="submit"]');check(!submit||submit.disabled,'guest cannot publish');d().querySelector('[data-svc-action="close"]')?.click();await route('profile');click('[data-account-action="open"]');await until(()=>d().querySelector('[data-account-action="verified"]'),'server session available');click('[data-account-action="verified"]');await until(()=>localStorage.getItem('sv-account-choice-v1')==='account','explicit signed choice');await until(()=>!d().querySelector('.sv-account-dialog[open]'),'account closes');await route('community');await until(()=>w().SVCommunity.viewer()?.id==='preview-owner','trusted community identity');await route('profile');click('[data-account-action="guest"]');await route('community');await until(()=>w().SVCommunity.viewer()===null,'guest clears private community');await route('tuner');check(!!d().querySelector('[data-action="reference"]'),'guest tuner still present');return {...layout(),publicPosts:publicState.posts.length,identityChecked:true};});
document.querySelector('#audio').onclick=()=>run('v18-audio-smoke',async()=>{settings('en');localStorage.setItem('sv-account-choice-v1','guest');await load('practice');await dismissStartup();click('[data-action="audio-test"]');let peak=0;for(let i=0;i<22;i++){peak=Math.max(peak,w().SVAudioEngine.getLevel());await delay(30);}check(peak>.0001,'test tone actual signal');await route('tuner');click('[data-action="reference"]');let reference=0;for(let i=0;i<20;i++){reference=Math.max(reference,w().SVAudioEngine.getLevel());await delay(30);}w().SVAudioEngine.stop();check(reference>.0001,'tuner actual signal');return {toneRmsPeak:peak,referenceRmsPeak:reference,...layout()};});
document.querySelector('#account-preview').onclick=()=>run('v18-account-display',async()=>{settings('en');localStorage.setItem('sv-account-choice-v1','guest');await load('profile');await dismissStartup();click('[data-account-action="open"]');await until(()=>d().querySelector('[data-account-action="verified"]'),'verified account');return {dialogLanguage:d().querySelector('.sv-account-dialog').lang,...layout()};});
document.querySelector('#splash').onclick=()=>run('v18-splash-display',async()=>{settings('en');localStorage.setItem('sv-account-choice-v1','guest');await load('home');await delay(1500);const rect=selector=>{const r=d().querySelector(selector).getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height};};return {display:'startup shared violin',innerWidth:w().innerWidth,innerHeight:w().innerHeight,outerWidth:w().outerWidth,layer:rect('#startup-layer'),card:rect('.startup-card'),art:rect('.startup-art'),logo:rect('.startup-logo')};});
})();
</script>
