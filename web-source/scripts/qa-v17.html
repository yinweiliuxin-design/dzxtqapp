<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V17 实际音频与任务验收</title>
<style>body{font:14px/1.6 system-ui;color:#24372d;background:#f3f6f1;margin:0;padding:20px}main{display:grid;grid-template-columns:minmax(300px,1fr) auto;gap:24px;max-width:1200px;margin:auto}section{background:white;border:1px solid #d1ded2;padding:20px;border-radius:18px}label{display:grid;gap:6px;margin:12px 0}button,select,input{font:inherit;min-height:40px;padding:8px;border-radius:8px;border:1px solid #bacdbb}button{cursor:pointer;margin:4px}iframe{width:390px;height:844px;border:0;background:#fff}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:650px;overflow:auto}.fail{color:#a03030}.pass{color:#205c3b}</style>
<main><section><h1>V17 全流程验收台</h1><p>仅本机测试。音频判据包含实际 Web Audio 输出 RMS，不以 playing 状态代替。麦克风和摄像头使用浏览器生成的测试设备。</p>
<label>语言<select id="lang"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="de">Deutsch</option></select></label>
<label>页面<select id="page"></select></label><label>视窗宽度<select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1440</option></select></label>
<button id="load">载入</button><button id="layout">检查布局与入口</button><button id="learning">检查六步与设置入口</button>
<label>音频任务<select id="task"><option value="sample">小提琴采样示范</option><option value="clean">纯净合成示范</option><option value="reference">调音参考音</option><option value="metronome">节拍器</option><option value="chord">练习和弦</option><option value="tone">创作音色试听</option><option value="string">独奏弦乐</option><option value="strings">弦乐和弦</option><option value="scale">音阶</option><option value="midi">MIDI 回放</option><option value="backing">原创伴奏</option><option value="record">合成录音及回放</option><option value="loop">循环录音及回放</option><option value="microphone">模拟麦克风录音</option><option value="video">模拟摄像头视频录制</option></select></label>
<button id="audio-load">进入任务页面</button><button id="audio-run">执行任务并测输出</button><button id="stop">停止全部</button><button id="local">检查本机预设与曲库任务</button>
<p id="state" role="status">等待操作</p><pre id="result"></pre></section><section style="padding:0;overflow:auto;max-width:calc(100vw - 40px)"><iframe id="app" src="/__qa/blank" allow="autoplay; microphone; camera" title="真实应用"></iframe></section></main>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),frame=$('#app'),routes=['home','library','practice','studio','performance','midi','tones','tuner','metronome','device','learn','community','shop','profile'];$('#page').innerHTML=routes.map(p=>'<option>'+p+'</option>').join('');let busy=false;const results=[];
const wait=ms=>new Promise(r=>setTimeout(r,ms)),app=()=>frame.contentWindow,doc=()=>app().document;
async function until(fn,label,ms=15000){const start=performance.now();while(performance.now()-start<ms){const v=await fn();if(v)return v;await wait(35);}throw Error('等待超时 '+label+' · '+(doc().querySelector('#notice')?.textContent||''));}
function click(s){const el=doc().querySelector(s);if(!el||el.disabled)throw Error('控件不可用 '+s);el.click();return el;}
async function pref(k,value){const el=doc().querySelector('[data-pref="'+k+'"]');if(!el)throw Error('设置不存在 '+k);if(el.type==='checkbox')el.checked=value;else el.value=value;el.dispatchEvent(new (app().Event)('change',{bubbles:true}));await wait(100);}
async function save(id,data){const item={id,date:new Date().toISOString(),...data};results.push(item);$('#result').textContent=JSON.stringify(item,null,2);await fetch('/__qa/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item)});return item;}
async function run(id,fn){if(busy)return;busy=true;for(const b of document.querySelectorAll('button'))b.disabled=true;$('#state').textContent='执行中 '+id;try{const result=await fn();await save(id,{pass:true,...result});$('#state').textContent='通过 '+id;$('#state').className='pass';}catch(e){await save(id,{pass:false,error:String(e.message||e)});$('#state').textContent='失败 '+id+' '+e.message;$('#state').className='fail';}finally{busy=false;for(const b of document.querySelectorAll('button'))b.disabled=false;}}
function initial(){const lang=$('#lang').value;let p={};try{p=JSON.parse(localStorage.getItem('sv12-prefs')||'{}');}catch{}localStorage.setItem('sv12-prefs',JSON.stringify({...p,lang,region:{zh:'cn',en:'us',ja:'jp',de:'de'}[lang],localeChoiceVersion:1,appMode:'full',tutorialAuto:false,tutorialVersion:1,learningPathShownVersion:1,learningPathIntroducedVersion:1,bpm:100,repeat:true,from:1,to:2,effects:{volume:.75,reverb:.1,delay:0,compression:.2}}));}
async function load(page){initial();frame.style.width=$('#width').value+'px';const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.src='/?qaHarness=17&t='+Date.now()+'#'+page;await loaded;await until(()=>app().SVAudioEngine&&doc().querySelector('#main')?.children.length,'应用');await wait(150);return app();}
async function route(page){if(app().location.hash!=='#'+page){app().location.hash=page;await until(()=>app().location.hash==='#'+page,'路由');await wait(180);}return app();}
async function layout(){const w=app(),d=doc(),adminLinks=[...d.querySelectorAll('a[href]')].filter(a=>/^\/admin(?:[/.?#]|$)/.test(a.getAttribute('href')));if(adminLinks.length)throw Error('客户端仍显示后台入口');if(d.documentElement.scrollWidth>d.documentElement.clientWidth+1)throw Error('横向溢出 '+d.documentElement.scrollWidth+'/'+d.documentElement.clientWidth);if(w.__qaErrors?.length)throw Error(w.__qaErrors.join(' / '));return {route:w.location.hash,lang:d.documentElement.lang,innerWidth:w.innerWidth,clientWidth:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,adminLinks:adminLinks.length,steps:d.querySelectorAll('[data-lp-step]').length};}
const taskRoute={sample:'practice',clean:'practice',reference:'tuner',metronome:'metronome',chord:'practice',tone:'tones',string:'performance',strings:'performance',scale:'performance',midi:'midi',backing:'performance',record:'studio',loop:'studio',microphone:'studio',video:'studio'};
async function peak(ms=1250){const values=[];for(let i=0;i<ms/30;i++){values.push(app().SVAudioEngine.getLevel());await wait(30);}const max=Math.max(...values);return {peakRms:max,nonzeroFrames:values.filter(v=>v>.0001).length,frames:values.length,status:app().SVAudioEngine.status()};}
async function decode(blob){const w=app(),ctx=new w.OfflineAudioContext(1,1,44100),buffer=await ctx.decodeAudioData(await blob.arrayBuffer());let sum=0,max=0,n=0;for(let ch=0;ch<buffer.numberOfChannels;ch++){const data=buffer.getChannelData(ch);for(const v of data){sum+=v*v;max=Math.max(max,Math.abs(v));n++;}}return {duration:buffer.duration,peak:max,rms:Math.sqrt(sum/n),mime:blob.type,bytes:blob.size};}
function stop(){app().SVAudioEngine?.stop();for(const a of app().__qaAudioElements||[])a.pause();doc().querySelector('[data-action="stop"]')?.click();}
async function audio(){const w=app(),task=$('#task').value;if(w.location.hash!=='#'+taskRoute[task])throw Error('请先进入任务页面');let extra={};
if(task==='sample'||task==='clean'){await pref('demoVoice',task==='sample'?'violin-sample':'clean-synth');click('[data-action="play"]');}
else if(task==='reference')click('[data-action="reference"]');
else if(task==='metronome')click('[data-action="start-metro"]');
else if(task==='chord')click('[data-action="chord"]');
else if(task==='tone')click('[data-action="audition"]');
else if(task==='string')click('[data-perf-note="A4"]');
else if(task==='strings')click('[data-perf-chord="C"]');
else if(task==='scale')click('[data-perf-action="scale"]');
else if(task==='midi'){click('[data-midi-action="add"]');click('[data-midi-action="play"]');}
else if(task==='backing'){click('[data-perf-track]');await until(()=>doc().querySelector('[data-perf-action="play"]')&&!doc().querySelector('[data-perf-action="play"]').disabled,'伴奏');click('[data-perf-action="play"]');const a=await until(()=>(w.__qaAudioElements||[]).find(a=>!a.paused),'实际伴奏');const t=a.currentTime;await wait(500);if(a.currentTime<=t||a.muted||a.volume===0)throw Error('伴奏未推进或静音');extra={native:{duration:a.duration,currentTime:a.currentTime,muted:a.muted,volume:a.volume},decoded:await decode(await w.fetch(a.src).then(r=>r.blob()))};if(extra.decoded.rms<.0001)throw Error('伴奏PCM无声');stop();return extra;}
else if(['record','loop','microphone','video'].includes(task)){const kind=task==='loop'?'loop':task==='video'?'video':'recording';await pref('source',task==='microphone'?'microphone':'synth');const before=await w.SVMediaStore.list();click(task==='loop'?'[data-action="record-loop"]':task==='video'?'[data-action="record-video"]':'[data-action="record-audio"]');await until(()=>w.SVAudioEngine.status().captures>0||task==='video'&&!doc().querySelector('[data-action="stop-record"]').disabled,'开始录制',20000);await wait(1300);click('[data-action="stop-record"]');const item=await until(async()=>{const rows=await w.SVMediaStore.list();return rows.find(r=>r.kind===kind&&!before.some(b=>b.id===r.id));},'保存媒体',20000);extra={record:{kind:item.kind,bytes:item.blob.size,mime:item.blob.type,duration:item.duration}};if(task==='video')return extra;extra.decoded=await decode(item.blob);if(extra.decoded.rms<.0001)throw Error('录音PCM无声');if(task==='loop'){click('[data-action="play-loops"]');const p=await peak();if(p.peakRms<.0001)throw Error('循环回放无输出');extra.playback=p;stop();}return extra;}
const measure=await peak();if(measure.peakRms<.0001)throw Error('实际输出RMS为零 '+JSON.stringify(measure.status));stop();return {task,...measure,...extra};}
$('#load').onclick=()=>run('layout-load-'+$('#lang').value+'-'+$('#page').value+'-'+$('#width').value,async()=>{await load($('#page').value);return layout();});$('#layout').onclick=()=>run('layout-'+$('#lang').value+'-'+$('#page').value+'-'+$('#width').value,layout);
$('#audio-load').onclick=()=>run('audio-load-'+$('#task').value,async()=>{await load(taskRoute[$('#task').value]);return layout();});$('#audio-run').onclick=()=>run('audio-'+$('#task').value,audio);$('#stop').onclick=()=>{stop();$('#state').textContent='已停止';};
$('#learning').onclick=()=>run('learning-workflow',async()=>{await route('profile');click('[data-action="tutorial"]');await until(()=>doc().querySelector('[data-lp-step]'),'六步入口');if(doc().querySelectorAll('[data-lp-step]').length!==6)throw Error('六步入口不完整');const before=wState()||{currentStepId:doc().querySelector('[aria-current="step"]').dataset.lpStep};click('[data-lp-action="understood"]');click('[data-lp-action="next"]');const after=wState();if(!after||after.currentStepId===before.currentStepId)throw Error('步骤未改变');const scene=doc().querySelector('[data-lp-scene] svg');const motion=doc().querySelector('[data-lp-action="motion"]');let animationCheck={systemReduced:motion.disabled};if(!motion.disabled){const animations=doc().querySelector('[data-lp-scene]').getAnimations({subtree:true});if(!animations.length)throw Error('没有实际CSS动画');const a=animations[0],t=Number(a.currentTime);await wait(160);if(Number(a.currentTime)<=t)throw Error('动画未推进');motion.click();await wait(60);const stopped=Number(a.currentTime);await wait(140);if(Math.abs(Number(a.currentTime)-stopped)>1)throw Error('动画暂停后仍在推进');if(doc().querySelector('[data-lp-scene] svg')!==scene)throw Error('暂停重建了动画');motion.click();await wait(130);if(Number(a.currentTime)<=stopped)throw Error('继续播放未恢复');animationCheck={pausedFramePreserved:true,resumed:true,actualCssAnimation:true};}click('[data-lp-action="replay"]');await route('home');await route('learn');const restored=wState();if(restored.currentStepId!==after.currentStepId)throw Error('学习进度未保存');return {steps:6,before,after,restored,animationCheck,oldGuideOpen:!!doc().querySelector('.tutorial-dialog[open]')};});function wState(){return JSON.parse(localStorage.getItem('smartvio-learning-path-v1')||'null');}
$('#local').onclick=()=>run('local-core-workflows',async()=>{await route('library');const favorite=doc().querySelector('[data-action="favorite"]');if(!favorite)throw Error('缺少收藏按钮');const fav=favorite.getAttribute('aria-pressed');favorite.click();await wait(80);await route('tones');click('[data-action="save-preset"]');const name=doc().querySelector('#preset-name');name.value='V17 QA preset';click('[data-action="commit-preset"]');await until(()=>doc().body.textContent.includes('V17 QA preset'),'预设');await route('profile');const goal=doc().querySelector('#daily-goal');goal.value='25';click('[data-action="save-goal"]');await wait(80);if(doc().querySelector('#daily-goal').value!=='25')throw Error('目标保存失败');return {favoriteAction:true,presetSave:true,dailyGoalSave:true,...await layout()};});
})();
</script></html>

<script src="/__qa/workflows.js"></script>

<script src="/__qa/admin.js"></script>
